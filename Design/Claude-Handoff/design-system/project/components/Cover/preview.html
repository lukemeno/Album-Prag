<!-- @dsCard height=300 -->
<!doctype html><html lang="de"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: var(--paper); }
  .cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--paper); }
  .cv svg { position: absolute; inset: 0; }
  .ink { fill: var(--ink); }
  .sel { fill: var(--selection); }
  .butter { fill: var(--mat-butter); }
  .coral { fill: var(--red); }
  .tile { fill: var(--card); }
  .dot { fill: var(--card); }
  .hl { fill: none; stroke: var(--ink); stroke-width: 3; }
  .txt { position: absolute; left: 40px; bottom: 32px; width: 440px; }
  .nm { font: 600 92px/0.95 var(--font-display); letter-spacing: -1px; color: var(--ink); margin: 0; }
  .tg { font: 400 14px/20px var(--font-sans); color: var(--ink-soft); margin: 12px 0 0; }
</style></head><body>
<div class="cv">
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
  <!--
    blocks:   ink 160×240 (radius-card 22), selection 240×144 (radius-card), mat-butter 112×128 (radius-tile 16), red disc ⌀48 (size-assistant)
    arrange:  one tall ink slab bleeding off the top, selection and butter as satellites to its right; the coral disc stays small (it is a signal ink, not an identity field)
    pattern:  "literal motif" row – the photo pin: card-coloured tiles at size-pin scale with radius-thumb 12 and a dot foot, the shape Album's map is remembered by; one tile carries the selected ink ring
    scales:   pin 44 (≈size-pin), pitch 64 = space-m×4, gaps space-m 16, radii radius-thumb 12 · radius-tile 16 · radius-card 22
  -->
  <rect class="ink" x="512" y="-22" width="160" height="240" rx="22"/>
  <rect class="sel" x="688" y="32" width="240" height="144" rx="22"/>
  <rect class="butter" x="688" y="192" width="112" height="128" rx="16"/>
  <circle class="coral" cx="856" cy="240" r="24"/>
  <!-- photo-pin pattern on the selection block -->
  <rect class="tile" x="712" y="56" width="44" height="44" rx="12"/><circle class="dot" cx="734" cy="110" r="3.5"/>
  <rect class="tile" x="776" y="56" width="44" height="44" rx="12"/><circle class="dot" cx="798" cy="110" r="3.5"/>
  <rect class="tile" x="840" y="56" width="44" height="44" rx="12"/><circle class="dot" cx="862" cy="110" r="3.5"/>
  <rect class="tile" x="776" y="120" width="44" height="44" rx="12"/><rect class="hl" x="773" y="117" width="50" height="50" rx="14"/>
  <!-- pins continuing onto the ink slab -->
  <rect class="tile" x="536" y="56" width="44" height="44" rx="12"/><circle class="dot" cx="558" cy="110" r="3.5"/>
  <rect class="tile" x="600" y="120" width="44" height="44" rx="12"/><circle class="dot" cx="622" cy="174" r="3.5"/>
  <rect class="tile" x="712" y="216" width="44" height="44" rx="12"/><circle class="dot" cx="734" cy="270" r="3.5"/>
</svg>
<div class="txt"><p class="nm">Album –<br>Prag</p><p class="tg">Ein gemeinsames Reisejournal für zwei. Cozy, leicht, fotoorientiert.</p></div>
</div>
</body></html>

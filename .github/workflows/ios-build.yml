name: iOS Build

# Baut Album ohne Signierung in der Cloud: App und Share Extension für Simulator und Gerät,
# dazu die Unit-Tests auf einem iPhone-Simulator. Installieren aufs iPhone geht weiter nur über Xcode am Mac.
on:
  push:
    branches: ['claude/**', 'design/**']
    paths-ignore: ['**/*.md', 'Design/**']
  workflow_dispatch:

# Nebenläufigkeit pro Job: Ein neuer Push ersetzt Build, Screen-Tour und Audits sofort.
# Die langen UI-Tests laufen dagegen zu Ende; der neueste Stand wartet dahinter.

jobs:
  build:
    runs-on: macos-26
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode wählen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          mkdir -p logs

      - name: Pakete laden
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project Album.xcodeproj -scheme Album -derivedDataPath DerivedData 2>&1 | tee logs/packages.log | tail -20

      - name: App für Simulator bauen
        run: |
          set -o pipefail
          xcodebuild build \
            -project Album.xcodeproj -scheme Album \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee logs/build-simulator.log | xcbeautify --renderer github-actions

      - name: Unit-Tests (iPhone 17 Pro, iOS 26.5)
        if: success()
        run: |
          set -o pipefail
          xcodebuild test \
            -project Album.xcodeproj -scheme Album \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -derivedDataPath DerivedData \
            -only-testing:AlbumTests \
            -resultBundlePath logs/AlbumTests.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee logs/test.log | xcbeautify --renderer github-actions

      - name: App für iPhone bauen (ohne Signierung)
        if: always()
        run: |
          set -o pipefail
          xcodebuild build \
            -project Album.xcodeproj -scheme Album \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee logs/build-device.log | xcbeautify --renderer github-actions

      - name: Logs sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: logs
          retention-days: 7

  # Screen-Tour: jeder Screen und Zustand als Bild (hell, dunkel, quer, große Schrift).
  # Die Bilder landen als JPEG im Branch ci-screens/<branch>, damit man sie ohne Xcode ansehen kann.
  screens:
    runs-on: macos-26
    concurrency:
      group: screens-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Xcode wählen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          mkdir -p logs

      - name: Simulator starten
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k,v in d.items() if k.endswith('iOS-26-5') for x in v if x['name']=='iPhone 17 Pro'][0])")
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # Wie auf den iPhones: Systemoberflächen (Fotos-Picker, Teilen-Blatt) auf Deutsch,
          # sonst finden die UI-Tests „Fotos“ und „Schließen“ nicht.
          xcrun simctl spawn "$udid" defaults write -g AppleLanguages -array de-DE
          xcrun simctl spawn "$udid" defaults write -g AppleLocale -string de_DE
          xcrun simctl shutdown "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Screen-Tour (iPhone 17 Pro, iOS 26.5)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Album.xcodeproj -scheme Album \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -derivedDataPath DerivedData \
            -only-testing:AlbumUITests/ScreenTourUITests \
            -resultBundlePath logs/Screens.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee logs/screens.log | xcbeautify --renderer github-actions

      - name: Bilder exportieren
        if: always()
        run: |
          mkdir -p raw screens
          xcrun xcresulttool export attachments --path logs/Screens.xcresult --output-path raw || true
          python3 - <<'PY'
          import json, os, subprocess
          images = ('.png', '.jpg', '.jpeg', '.heic')
          def convert(src, name):
              subprocess.run(['sips', '-s', 'format', 'jpeg', '-s', 'formatOptions', '72', '-Z', '1400', src,
                              '--out', os.path.join('screens', name + '.jpg')], check=True, capture_output=True)
          try:
              manifest = json.load(open('raw/manifest.json'))
              for test in manifest:
                  for item in test.get('attachments', []):
                      src = os.path.join('raw', item['exportedFileName'])
                      if src.lower().endswith(images):
                          convert(src, item.get('suggestedHumanReadableName', item['exportedFileName']).split('_')[0])
          except Exception as error:
              print('Manifest nicht lesbar, nehme alle Bilder:', error)
              for file in sorted(os.listdir('raw')):
                  if file.lower().endswith(images):
                      convert(os.path.join('raw', file), os.path.splitext(file)[0])
          PY
          ls screens

      - name: Bilder in Branch ablegen
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="ci-screens/${GITHUB_REF_NAME//\//-}"
          cp logs/screens.log screens/ 2>/dev/null || true
          cd screens
          echo "Screen-Tour von ${GITHUB_SHA} (${GITHUB_REF_NAME})" > README.md
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screen-Tour ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"refs/heads/${branch}"

  # Alle bestehenden UI-Tests (Abläufe, Bewegung, Barrierefreiheit) auf dem Simulator.
  uitests:
    runs-on: macos-26
    concurrency:
      group: uitests-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Xcode wählen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          mkdir -p logs

      - name: Simulator starten
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k,v in d.items() if k.endswith('iOS-26-5') for x in v if x['name']=='iPhone 17 Pro'][0])")
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # Wie auf den iPhones: Systemoberflächen (Fotos-Picker, Teilen-Blatt) auf Deutsch,
          # sonst finden die UI-Tests „Fotos“ und „Schließen“ nicht.
          xcrun simctl spawn "$udid" defaults write -g AppleLanguages -array de-DE
          xcrun simctl spawn "$udid" defaults write -g AppleLocale -string de_DE
          xcrun simctl shutdown "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: UI-Tests (iPhone 17 Pro, iOS 26.5)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Album.xcodeproj -scheme Album \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -derivedDataPath DerivedData \
            -only-testing:AlbumUITests \
            -skip-testing:AlbumUITests/ScreenTourUITests \
            -resultBundlePath logs/UITests.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee logs/uitests.log | xcbeautify --renderer github-actions

      - name: Accessibility-Funde ausgeben
        if: always()
        run: |
          xcrun xcresulttool export attachments --path logs/UITests.xcresult --output-path a11y || exit 0
          python3 .github/scripts/a11y_findings.py a11y

      - name: Logs sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-logs
          path: logs
          retention-days: 7

  # Nur die Accessibility-Audits: Funde stehen nach etwa 15 Minuten im Log statt nach dem ganzen UI-Testlauf.
  a11y:
    runs-on: macos-26
    concurrency:
      group: a11y-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Xcode wählen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          mkdir -p logs

      - name: Simulator starten
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k,v in d.items() if k.endswith('iOS-26-5') for x in v if x['name']=='iPhone 17 Pro'][0])")
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # Wie auf den iPhones: Systemoberflächen (Fotos-Picker, Teilen-Blatt) auf Deutsch,
          # sonst finden die UI-Tests „Fotos“ und „Schließen“ nicht.
          xcrun simctl spawn "$udid" defaults write -g AppleLanguages -array de-DE
          xcrun simctl spawn "$udid" defaults write -g AppleLocale -string de_DE
          xcrun simctl shutdown "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Accessibility-Audits (iPhone 17 Pro, iOS 26.5)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Album.xcodeproj -scheme Album \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -derivedDataPath DerivedData \
            -only-testing:AlbumUITests/AlbumUITests/testAccessibilityAuditReiseScreen \
            -only-testing:AlbumUITests/AlbumUITests/testAccessibilityAuditPlaceEditorScreen \
            -only-testing:AlbumUITests/AlbumUITests/testAccessibilityAuditIdeasScreen \
            -only-testing:AlbumUITests/AlbumUITests/testAccessibilityAuditMapScreen \
            -resultBundlePath logs/A11y.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee logs/a11y.log | xcbeautify --renderer github-actions

      - name: Accessibility-Funde ausgeben
        if: always()
        run: |
          xcrun xcresulttool export attachments --path logs/A11y.xcresult --output-path a11y || exit 0
          python3 .github/scripts/a11y_findings.py a11y

      - name: Fundbilder in Branch ablegen
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d a11y ] || exit 0
          python3 .github/scripts/a11y_issue_shots.py a11y a11y-shots
          python3 .github/scripts/a11y_findings.py a11y > a11y-shots/findings.txt
          branch="ci-a11y/${GITHUB_REF_NAME//\//-}"
          cd a11y-shots
          echo "Accessibility-Funde von ${GITHUB_SHA} (${GITHUB_REF_NAME})" > README.md
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Accessibility-Funde ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"refs/heads/${branch}"

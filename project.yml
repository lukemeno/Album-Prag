name: Album
options:
  bundleIdPrefix: de.privatealbum
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: X7K385PZ68
    CODE_SIGN_STYLE: Automatic
    SUPABASE_URL: "https://akzrlkbylglwrlbaacjo.supabase.co"
    SUPABASE_ANON_KEY: "sb_publishable_yQgk23feVRz0OYzaIlff2g_zD999Wjh"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Album:
    type: application
    platform: iOS
    sources:
      - path: Album
        excludes: ["**/.omc/**"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.privatealbum.prague
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Album/Info.plist
      properties:
        CFBundleDisplayName: Album
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIAppFonts: [Fraunces-SemiBold.ttf, InstrumentSerif-Regular.ttf]
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: true
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: de.privatealbum.prague.invitation
            CFBundleURLSchemes: [album]
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
    dependencies:
      - package: Supabase
      - package: RiveRuntime
  AlbumTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AlbumTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Album
  AlbumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AlbumUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Album
schemes:
  Album:
    build:
      targets:
        Album: all
    test:
      targets: [AlbumTests, AlbumUITests]
packages:
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios.git
    exactVersion: 6.27.0
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.2
